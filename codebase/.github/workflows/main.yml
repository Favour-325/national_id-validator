name: Secure CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    env:
      # Build the full image name using sanitized Docker Hub username
      IMAGE: ${{ format('{0}/id-validator:latest', replace(replace(secrets.DOCKERHUB_USERNAME, '\n', ''), '\r', '')) }}

    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ replace(replace(secrets.DOCKERHUB_USERNAME, '\n', ''), '\r', '') }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 4: Build and push Docker image using Buildx
      - name: Build & Push Docker image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t "$IMAGE" \
            -f ./codebase/Dockerfile \
            ./codebase \
            --push

      # Step 5: Run Trivy Security Scan
      - name: Trivy Security Scan
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
