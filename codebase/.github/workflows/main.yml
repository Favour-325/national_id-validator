name: Secure CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    env:
      # Sanitize the username secret to remove any newlines/CR and build the image name
      IMAGE: ${{ format('{0}/id-validator:latest', replace(replace(secrets.DOCKERHUB_USERNAME, '\n', ''), '\r', '')) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          # Pass a sanitized username to avoid embedded newline/CR breaking shell commands
          username: ${{ replace(replace(secrets.DOCKERHUB_USERNAME, '\n', ''), '\r', '') }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          # Explicitly provide Dockerfile path and build context to avoid ambiguous/line-broken commands
          docker build -t "$IMAGE" -f ./codebase/Dockerfile ./codebase

      - name: Trivy Security Scan
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

      - name: Push Docker image
        if: success()
        run: |
          docker push "$IMAGE"
