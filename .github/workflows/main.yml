name: rCI National ID Validator

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image locally
        run: |
          docker build -t national-id-validator:${{ github.sha }} .

      # This is the "rCI" magic step
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'national-id-validator:${{ github.sha }}'
          format: 'table'
          exit-code: '1' # This crashes the pipeline if vulnerabilities are found
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Login to Docker Hub
        if: success() # Only runs if the scan passes
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOK }}

      - name: Push to Docker Hub
        if: success()
        run: |
          docker tag national-id-validator:${{ github.sha }} ${{ secrets.DOCKERHUB_USER }}/id-validator:latest
          docker push ${{ secrets.DOCKERHUB_USER }}/id-validator:latest