name: Secure CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-scan-push:
    runs-on: ubuntu-latest

    steps:
      # Step 0: Get the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 1: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 2: Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 3: Build the Docker image (local only)
      - name: Build Docker image
        run: |
          docker buildx build -f ./codebase/Dockerfile -t ${{ secrets.DOCKERHUB_USERNAME }}/id-validator:latest ./codebase

      # Step 4: Security Scan with Trivy
      - name: Trivy Security Scan
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/id-validator:latest
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

      # Step 5: Push image ONLY if scan passes
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/id-validator:latest
