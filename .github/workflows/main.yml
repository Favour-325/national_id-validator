name: Simple CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Docker image
        run: |
          # Remove newlines from secret to fix Docker tag
          USERNAME=$(echo "${{ secrets.DOCKERHUB_USERNAME }}" | tr -d '\n\r')
          IMAGE="$USERNAME/id-validator:latest"
          echo "Building and pushing image: $IMAGE"

          # Build Docker image
          docker build -t "$IMAGE" ./codebase

          # Push Docker image
          docker push "$IMAGE"
