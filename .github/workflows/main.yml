name: Simple CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-scan-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Docker image
        run: |
          # Build and sanitize image name
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/id-validator:latest"
          IMAGE=$(echo "$IMAGE" | tr -d '\n\r')  # remove hidden newlines
          echo "Building and pushing image: $IMAGE"

          # Ensure Dockerfile exists
          if [ ! -f ./codebase/Dockerfile ]; then
            echo "Error: Dockerfile not found at ./codebase/Dockerfile"
            exit 1
          fi

          # Build and push with Buildx
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t "$IMAGE" \
            -f ./codebase/Dockerfile \
            ./codebase \
            --push

      - name: Run Trivy security scan
        run: |
          # Use the exact same sanitized IMAGE variable
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/id-validator:latest"
          IMAGE=$(echo "$IMAGE" | tr -d '\n\r')
          echo "Scanning image: $IMAGE"

          # Run Trivy
          trivy image \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            "$IMAGE"
