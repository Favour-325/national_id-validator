name: Simple CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-scan-push:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 4: Build & Push Docker image using Buildx
      - name: Build & Push Docker image
        run: |
          # Sanitize Docker Hub username and construct image name
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/id-validator:latest"
          IMAGE=$(echo "$IMAGE" | tr -d '\n\r')
          echo "Building and pushing image: $IMAGE"

          # Ensure Dockerfile exists
          if [ ! -f ./codebase/Dockerfile ]; then
            echo "Error: Dockerfile not found at ./codebase/Dockerfile"
            exit 1
          fi

          # Build and push Docker image
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t "$IMAGE" \
            -f ./codebase/Dockerfile \
            ./codebase \
            --push

      # Step 5: Run Trivy security scan using the official Action
      - name: Trivy Security Scan
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: "${{ secrets.DOCKERHUB_USERNAME }}/id-validator:latest"
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
