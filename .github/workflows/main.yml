name: Simple CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-scan-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Docker image
        run: |
          # Sanitize the Docker Hub username and construct image name
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/id-validator:latest"
          IMAGE=$(echo "$IMAGE" | tr -d '\n\r')  # remove newlines
          echo "Building and pushing image: $IMAGE"

          # Build and push
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t "$IMAGE" \
            -f ./codebase/Dockerfile \
            ./codebase \
            --push

      - name: Trivy Security Scan
        uses: aquasecurity/trivy-action@0.20.0
        with:
          # Clean up the username secret inline to avoid hidden newlines
          image-ref: ${{ secrets.DOCKERHUB_USERNAME && secrets.DOCKERHUB_USERNAME | trim }}/id-validator:latest
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
